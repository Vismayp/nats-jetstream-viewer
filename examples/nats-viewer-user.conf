# Merge this user into the appropriate account in your NATS configuration.
# Replace WORK_STREAM with each stream the viewer may inspect, or use the
# wildcard form below to permit read-only inspection of all streams.
authorization {
  users: [
    {
      user: "jetstream_viewer"
      password: "REPLACE_ME"
      permissions: {
        publish: {
          allow: [
            "$JS.API.STREAM.LIST"
            "$JS.API.STREAM.INFO.>"
            "$JS.API.STREAM.MSG.GET.>"
            "$JS.API.DIRECT.GET.>"
            "$JS.API.CONSUMER.LIST.>"
            "$JS.API.CONSUMER.INFO.>"
          ]
        }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
  ]
}

# Deliberately absent:
# $JS.ACK.>                     (acknowledgements)
# $JS.API.CONSUMER.CREATE.>     (consumer creation)
# $JS.API.CONSUMER.DELETE.>     (consumer deletion)
# $JS.API.STREAM.DELETE.>       (stream deletion)
# $JS.API.STREAM.PURGE.>        (purge)
# $JS.API.STREAM.UPDATE.>       (stream mutation)
